    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }

        @keyframes streamRow1 {
            0% { transform: translateX(0px); }
            100% { transform: translateX(-615.0px); }
        }
        @keyframes streamRow2 {
            0% { transform: translateX(-675.5px); }
            100% { transform: translateX(0px); }
        }
        @keyframes streamRow3 {
            0% { transform: translateX(0px); }
            100% { transform: translateX(-624.0px); }
        }

        .row-stream-1 {
            animation: streamRow1 30s linear infinite;
        }
        .row-stream-2 {
            animation: streamRow2 34s linear infinite;
        }
        .row-stream-3 {
            animation: streamRow3 32s linear infinite;
        }

        .stream-viewport:hover .row-stream-1,
        .stream-viewport:hover .row-stream-2,
        .stream-viewport:hover .row-stream-3 {
            animation-play-state: paused;
        }
    </style>

