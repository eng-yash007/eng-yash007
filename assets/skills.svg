<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
    <style>
        .text-primary { font-family: JetBrains Mono, monospace; fill: #c9d1d9; }
        .text-secondary { font-family: JetBrains Mono, monospace; fill: #8b949e; }
        .text-accent { font-family: JetBrains Mono, monospace; fill: #39d353; }
        .bg { fill: #0d1117; }
        .border { stroke: #30363d; fill: none; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .fade-in {
            animation: fadeIn 0.4s forwards ease-out;
        }
        
        @keyframes growBar {
            from { clip-path: inset(0 100% 0 0); }
            to { clip-path: inset(0 0 0 0); }
        }
        .bar-grow {
            animation: growBar 0.6s forwards cubic-bezier(0.1, 0.8, 0.2, 1);
        }
    </style>
    
    <rect width="400" height="300" class="bg" rx="6" />
    <rect width="400" height="300" class="border" rx="6" stroke-width="2"/>
    
    
    <rect width="100%" height="30" fill="#30363d" rx="4" />
    <circle cx="15" cy="15" r="6" fill="#ff5f56"/>
    <circle cx="35" cy="15" r="6" fill="#ffbd2e"/>
    <circle cx="55" cy="15" r="6" fill="#27c93f"/>
    <text x="50%" y="20" class="text-primary" font-size="14" text-anchor="middle">yash@github: ~/skills</text>
    
    
        <g class="fade-in" style="animation-delay: 0.5s; opacity: 0;">
            <text x="30" y="60" font-size="14" class="text-accent" xml:space="preserve">Python      </text>
