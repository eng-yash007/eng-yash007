<svg xmlns="http://www.w3.org/2000/svg" width="132" height="34" viewBox="0 0 132 34">
    <defs>
        <linearGradient id="bg-grad-linkedin" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0d1322" />
            <stop offset="100%" stop-color="#060912" />
        </linearGradient>

        <linearGradient id="border-grad-linkedin" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0a66c2" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#0a66c2" stop-opacity="0.6" />
        </linearGradient>
    </defs>

    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }

        @keyframes badgePulse {
            0%, 100% { stroke-opacity: 0.5; }
            50% { stroke-opacity: 0.95; }
        }
        @keyframes dotGlow {
            0%, 100% { r: 2.2px; opacity: 0.6; }
            50% { r: 3.2px; opacity: 1; }
        }

        .card-border {
            animation: badgePulse 3s infinite ease-in-out;
        }
        .live-dot {
            animation: dotGlow 2s infinite ease-in-out;
        }
    </style>

    <!-- Pill Container -->
    <rect width="132" height="34" rx="17" fill="url(#bg-grad-linkedin)" />
    <rect width="132" height="34" rx="17" fill="none" stroke="url(#border-grad-linkedin)" stroke-width="1.1" class="card-border" />

    <!-- Icon on Left -->
    <g transform="translate(10, 8.5) scale(0.85)">
        <path fill="#0a66c2" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
    </g>

    <!-- Text details -->
    <text x="32" y="15" class="font-sans" font-size="10.5" font-weight="700" fill="#f8fafc">
        LinkedIn
    </text>
    <text x="32" y="26" class="font-mono" font-size="8" font-weight="500" fill="#94a3b8">
        eng-yash007
    </text>

    <!-- Live indicator on Right -->
    <circle cx="120" cy="17" r="2.5" fill="#0a66c2" class="live-dot" />
</svg>