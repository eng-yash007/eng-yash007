<svg xmlns="http://www.w3.org/2000/svg" width="280" height="210" viewBox="0 0 280 210">
    <defs>
        <linearGradient id="card-bg-silent-gallery" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" stop-opacity="0.96" />
            <stop offset="100%" stop-color="#060912" stop-opacity="0.96" />
        </linearGradient>
    </defs>

    <rect width="280" height="210" rx="12" fill="url(#card-bg-silent-gallery)" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Status Badge -->
    <g transform="translate(16, 16)">
        <rect width="88" height="20" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <text x="44" y="14" fill="#34d399" font-size="9.5" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">LIVE DEMO</text>
    </g>

    <!-- Action Prompt on top right -->
    <text x="264" y="30" fill="#34d399" font-size="10" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">OPEN LIVE APP ↗</text>
    
    <!-- Title -->
    <text x="16" y="56" fill="#f8fafc" font-size="16.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Silent Gallery</text>
    <text x="16" y="74" fill="#818cf8" font-size="11.5" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Voice AI Workspace</text>
    
    <!-- Description -->
    <text x="16" y="96" fill="#94a3b8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
        <tspan x="16" dy="0">Voice productivity hub with Whisper</tspan>
        <tspan x="16" dy="16">& Groq/Llama-3 for natural tasks,</tspan>
        <tspan x="16" dy="16">and real-time Google Calendar sync.</tspan>
    </text>
    
    <!-- Tech Stack Pills -->
    
        <rect x="16" y="146" width="64.4" height="20" rx="4" fill="#1e293b" fill-opacity="0.8"/>
        <text x="48.2" y="159.5" fill="#94a3b8" font-size="9.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Next.js</text>
        
        <rect x="86.4" y="146" width="64.4" height="20" rx="4" fill="#1e293b" fill-opacity="0.8"/>
        <text x="118.60000000000001" y="159.5" fill="#94a3b8" font-size="9.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Llama-3</text>
        
        <rect x="156.8" y="146" width="64.4" height="20" rx="4" fill="#1e293b" fill-opacity="0.8"/>
        <text x="189.0" y="159.5" fill="#94a3b8" font-size="9.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Whisper</text>
        
        <rect x="227.20000000000002" y="146" width="71.6" height="20" rx="4" fill="#1e293b" fill-opacity="0.8"/>
        <text x="263.0" y="159.5" fill="#94a3b8" font-size="9.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Supabase</text>
        

    <!-- Bottom Action Ribbon -->
    <line x1="16" y1="178" x2="264" y2="178" stroke="#1e293b" stroke-width="1" />
    <text x="140.0" y="196" fill="#38bdf8" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">⚡ Click card to launch project</text>
</svg>