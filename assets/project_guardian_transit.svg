<svg xmlns="http://www.w3.org/2000/svg" width="280" height="210" viewBox="0 0 280 210">
    <defs>
        <linearGradient id="card-bg-guardian-transit-ai" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" stop-opacity="0.96" />
            <stop offset="100%" stop-color="#060912" stop-opacity="0.96" />
        </linearGradient>
    </defs>

    <rect width="280" height="210" rx="12" fill="url(#card-bg-guardian-transit-ai)" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Status Badge -->
    <g transform="translate(16, 16)">
        <rect width="88" height="20" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
        <text x="44" y="14" fill="#60a5fa" font-size="9.5" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">LIVE DEMO</text>
    </g>

    <!-- Action Prompt on top right -->
    <text x="264" y="30" fill="#60a5fa" font-size="10" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">OPEN LIVE APP ↗</text>
    
    <!-- Title -->
    <text x="16" y="56" fill="#f8fafc" font-size="16.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Guardian Transit AI</text>
    <text x="16" y="74" fill="#818cf8" font-size="11.5" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Biometric Transit Safety</text>
    
    <!-- Description -->
    <text x="16" y="96" fill="#94a3b8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
        <tspan x="16" dy="0">Real-time CV pipeline using YOLOv8</tspan>
        <tspan x="16" dy="16">& ArcFace for 512-d embeddings,</tspan>
        <tspan x="16" dy="16">pgvector search & live telemetry.</tspan>
    </text>
    
    <!-- Tech Stack Pills -->
    
        <rect x="16" y="146" width="64.4" height="20" rx="4" fill="#1e293b" fill-opacity="0.8"/>
        <text x="48.2" y="159.5" fill="#94a3b8" font-size="9.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">FastAPI</text>
        
        <rect x="86.4" y="146" width="57.2" height="20" rx="4" fill="#1e293b" fill-opacity="0.8"/>
        <text x="115.0" y="159.5" fill="#94a3b8" font-size="9.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">YOLOv8</text>
        
        <rect x="149.60000000000002" y="146" width="64.4" height="20" rx="4" fill="#1e293b" fill-opacity="0.8"/>
        <text x="181.8" y="159.5" fill="#94a3b8" font-size="9.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ArcFace</text>
        
        <rect x="220.00000000000003" y="146" width="71.6" height="20" rx="4" fill="#1e293b" fill-opacity="0.8"/>
        <text x="255.8" y="159.5" fill="#94a3b8" font-size="9.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">pgvector</text>
        

    <!-- Bottom Action Ribbon -->
    <line x1="16" y1="178" x2="264" y2="178" stroke="#1e293b" stroke-width="1" />
    <text x="140.0" y="196" fill="#38bdf8" font-size="10.5" font-weight="600" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">⚡ Click card to launch project</text>
</svg>