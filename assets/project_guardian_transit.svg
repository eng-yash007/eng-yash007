<svg xmlns="http://www.w3.org/2000/svg" width="440" height="220" viewBox="0 0 440 220">
    <defs>
        <linearGradient id="card-bg-guardian-transit" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0e1628" stop-opacity="0.96" />
            <stop offset="100%" stop-color="#070a14" stop-opacity="0.96" />
        </linearGradient>

        <linearGradient id="glow-guardian-transit" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
        </linearGradient>
    </defs>

    <!-- Outer Card Frame -->
    <rect width="440" height="220" rx="14" fill="url(#card-bg-guardian-transit)" stroke="#1e293b" stroke-width="1.2"/>
    <rect width="440" height="220" rx="14" fill="none" stroke="url(#glow-guardian-transit)" stroke-width="1" />
    
    <!-- Status Badge -->
    <g transform="translate(20, 18)">
        <rect width="108" height="22" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1.1"/>
        <circle cx="12" cy="11" r="3.5" fill="#60a5fa" />
        <text x="58" y="15" fill="#60a5fa" font-size="10" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">LIVE APP</text>
    </g>

    <!-- Action Prompt on top right -->
    <text x="420" y="33" fill="#60a5fa" font-size="11" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">LAUNCH APP ↗</text>
    
    <!-- Title & Subtitle -->
    <text x="20" y="66" fill="#f8fafc" font-size="19" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Guardian Transit AI</text>
    <text x="20" y="86" fill="#818cf8" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Edge AI & Biometric Public Transit Security</text>
    
    <!-- Description -->
    <text x="20" y="110" fill="#94a3b8" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
        <tspan x="20" dy="0">Real-time CV pipeline using YOLOv8 & ArcFace for 512-d biometric embeddings.</tspan>
        <tspan x="20" dy="18">Sub-50ms pgvector similarity search, multi-camera tracking & live alerts.</tspan>
    </text>
    
    <!-- Tech Stack Pills -->
    
        <rect x="20" y="152" width="68.5" height="22" rx="5" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
        <text x="54.25" y="167" fill="#cbd5e1" font-size="10.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">FastAPI</text>
        
        <rect x="96.5" y="152" width="61.0" height="22" rx="5" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
        <text x="127.0" y="167" fill="#cbd5e1" font-size="10.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">YOLOv8</text>
        
        <rect x="165.5" y="152" width="68.5" height="22" rx="5" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
        <text x="199.75" y="167" fill="#cbd5e1" font-size="10.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ArcFace</text>
        
        <rect x="242.0" y="152" width="76.0" height="22" rx="5" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
        <text x="280.0" y="167" fill="#cbd5e1" font-size="10.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">pgvector</text>
        
        <rect x="326.0" y="152" width="61.0" height="22" rx="5" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
        <text x="356.5" y="167" fill="#cbd5e1" font-size="10.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Python</text>
        

    <!-- Bottom Action Ribbon -->
    <line x1="20" y1="188" x2="420" y2="188" stroke="#1e293b" stroke-width="1" />
    <text x="220.0" y="206" fill="#38bdf8" font-size="11" font-weight="600" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">⚡ Click card to open live deployment</text>
</svg>