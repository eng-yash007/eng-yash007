        <text x="22" y="10" fill="#38BDF8" font-size="12" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace">FEATURED.SYSTEMS</text>
        <circle cx="170" cy="6" r="3.5" fill="#22D3EE"/>
