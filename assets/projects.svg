                <rect x="244" y="216" width="176" height="28" rx="6" fill="#0D1424" stroke="#8B5CF6" stroke-opacity="0.8" stroke-width="1"/>
                <text x="332.0" y="234" fill="#8B5CF6" font-size="11" font-weight="600" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">GitHub Repo ↗</text>
            </a>
        </g>
        
        <!-- Card 2: Guardian Transit AI -->
        <g class="project-card">
            <!-- Card Outer Surface -->
