<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
    <defs>
        <linearGradient id="proj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#080c16" />
            <stop offset="100%" stop-color="#050811" />
        </linearGradient>
    </defs>

    <!-- Outer Container -->
    <rect width="900" height="250" rx="14" fill="url(#proj-bg)" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Header -->
