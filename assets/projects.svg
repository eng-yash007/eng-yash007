            <rect x="694.0" y="184" width="74.0" height="20" rx="4" fill="#1e293b" fill-opacity="0.85"/>
            <text x="731.0" y="198" fill="#cbd5e1" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">pgvector</text>
            
            <rect x="776.0" y="184" width="59.0" height="20" rx="4" fill="#1e293b" fill-opacity="0.85"/>
            <text x="805.5" y="198" fill="#cbd5e1" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Python</text>
            
