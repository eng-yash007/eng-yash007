            <text x="844" y="78" fill="#8B5CF6" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" text-anchor="end">Computer Vision &amp; Student Safety</text>

