<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
    <defs>
        <linearGradient id="proj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#080c16" />
            <stop offset="100%" stop-color="#050811" />
        </linearGradient>
    </defs>

    <!-- Outer Container -->
    <rect width="900" height="250" rx="14" fill="url(#proj-bg)" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Header -->
    <g transform="translate(36, 28)">
        <path d="M 0 14 L 0 0 L 14 0" fill="none" stroke="#38bdf8" stroke-width="2"/>
        <text x="22" y="10" fill="#38bdf8" font-size="13" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace">FEATURED.SYSTEMS</text>
        <circle cx="185" cy="6" r="3.5" fill="#34d399"/>
        <text x="196" y="10" fill="#64748b" font-size="11" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace">PRODUCTION DEPLOYMENTS</text>
    </g>

    
        <!-- Project 1: Silent Gallery -->
        <g class="project-card">
            <rect x="36" y="56" width="406" height="168" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.2"/>
            
            <!-- Status Badge -->
            <g transform="translate(54, 72)">
                <rect width="90" height="20" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
                <circle cx="10" cy="10" r="3" fill="#34d399" />
                <text x="50" y="14" fill="#34d399" font-size="9.5" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">LIVE APP</text>
            </g>

            <text x="424" y="86" fill="#34d399" font-size="10" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">OPEN APP ↗</text>
            
            <!-- Title -->
            <text x="54" y="110" fill="#f8fafc" font-size="17" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Silent Gallery</text>
            <text x="54" y="128" fill="#818cf8" font-size="11.5" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Voice AI & Task Automation Workspace</text>
            
            <!-- Description -->
            <text x="54" y="148" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
                <tspan x="54" dy="0">Voice productivity hub with Whisper & Groq/Llama-3 for hands-free tasks.</tspan>
                <tspan x="54" dy="16">Real-time task execution, voice synthesis & Google Calendar synchronization.</tspan>
            </text>
            
            <!-- Tech Stack Pills -->
            
            <rect x="56" y="184" width="66.5" height="20" rx="4" fill="#1e293b" fill-opacity="0.85"/>
