<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="280" viewBox="0 0 900 280">
    <defs>
        <linearGradient id="proj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#080D18" />
            <stop offset="50%" stop-color="#0D1424" />
            <stop offset="100%" stop-color="#080D18" />
        </linearGradient>

        <linearGradient id="proj-border" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
            <stop offset="50%" stop-color="#334155" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#1E293B" stop-opacity="0.9"/>
        </linearGradient>
    </defs>

    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }

        .action-btn {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-btn:hover rect {
            fill: #162036;
            stroke-opacity: 1;
        }
    </style>

    <!-- Outer Container -->
    <rect width="900" height="280" rx="14" fill="url(#proj-bg)" stroke="url(#proj-border)" stroke-width="1.2"/>
    
    <!-- Header -->
    <g transform="translate(36, 30)">
        <path d="M 0 14 L 0 0 L 14 0" fill="none" stroke="#38BDF8" stroke-width="2"/>
        <text x="22" y="10" fill="#38BDF8" font-size="12" font-weight="700" class="font-mono">FEATURED.SYSTEMS</text>
        <circle cx="180" cy="6" r="3.5" fill="#34D399"/>
        <text x="192" y="10" fill="#64748B" font-size="10.5" class="font-mono">PRODUCTION DEPLOYMENTS</text>
    </g>

    
        <!-- Card 1: Silent Gallery -->
        <g class="project-card">
            <!-- Card Outer Surface -->
            <rect x="36" y="54" width="404" height="204" rx="10" fill="#0B1120" stroke="#1E293B" stroke-width="1.1"/>
            
            <!-- Subtle accent top border -->
            <line x1="48" y1="54" x2="428" y2="54" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1"/>

            <!-- Header Row: Project Identifier & Category -->
            <text x="56" y="78" fill="#64748B" font-size="10.5" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace">PROJECT 01</text>
            <text x="420" y="78" fill="#22D3EE" font-size="11" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" text-anchor="end">Voice AI &amp; Smart Task Workspace</text>

            <!-- Title -->
            <text x="56" y="108" fill="#F1F5F9" font-size="17" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Silent Gallery</text>

            <!-- Concise Description -->
            <text x="56" y="130" fill="#94A3B8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
                <tspan x="56" dy="0">AI-powered productivity workspace with voice interaction</tspan>
                <tspan x="56" dy="16">and hands-free task automation.</tspan>
            </text>

            <!-- Tech Tags -->
            
            <rect x="56" y="170" width="64.4" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="88.2" y="184" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Next.js</text>
            
            <rect x="126.4" y="170" width="64.4" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="158.6" y="184" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Llama-3</text>
            
            <rect x="196.8" y="170" width="64.4" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="229.0" y="184" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Whisper</text>
            
            <rect x="267.20000000000005" y="170" width="71.6" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
