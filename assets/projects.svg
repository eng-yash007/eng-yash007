<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
    <defs>
        <linearGradient id="proj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#080c16" />
            <stop offset="50%" stop-color="#0b101d" />
            <stop offset="100%" stop-color="#050811" />
        </linearGradient>

        <linearGradient id="proj-border" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
            <stop offset="50%" stop-color="#334155" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
        </linearGradient>
    </defs>

    <!-- Outer Container -->
    <rect width="900" height="260" rx="16" fill="url(#proj-bg)" stroke="url(#proj-border)" stroke-width="1.2"/>
    
    <!-- Header -->
    <g transform="translate(36, 32)">
        <path d="M 0 14 L 0 0 L 14 0" fill="none" stroke="#38bdf8" stroke-width="2"/>
        <text x="22" y="10" fill="#38bdf8" font-size="12.5" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace">FEATURED.SYSTEMS</text>
        <circle cx="185" cy="6" r="3.5" fill="#34d399"/>
        <text x="196" y="10" fill="#64748b" font-size="11" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace">PRODUCTION DEPLOYMENTS</text>
    </g>

    
        <!-- Card 1: Silent Gallery -->
        <g class="project-card">
            <rect x="36" y="60" width="404" height="176" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.2"/>
            
            <!-- Status Badge -->
            <g transform="translate(56, 78)">
                <rect width="124" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
                <circle cx="12" cy="11" r="3.5" fill="#34d399" />
                <text x="68" y="15" fill="#34d399" font-size="9.5" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">LIVE PRODUCTION</text>
            </g>

            <!-- Action Prompt -->
            <text x="420" y="93" fill="#34d399" font-size="11" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">LAUNCH APP ↗</text>
            
            <!-- Title & Subtitle -->
            <text x="56" y="124" fill="#f8fafc" font-size="19" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Silent Gallery</text>
            <text x="56" y="144" fill="#818cf8" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Voice AI & Smart Task Workspace</text>
            
            <!-- Description -->
            <text x="56" y="164" fill="#94a3b8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
                <tspan x="56" dy="0">Voice productivity hub with Whisper & Groq/Llama-3 for</tspan>
                <tspan x="56" dy="16">hands-free task execution and automated Google Calendar scheduling.</tspan>
            </text>
            
            <!-- Tech Stack Pills -->
            
            <rect x="56" y="192" width="68.5" height="22" rx="4" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
            <text x="90.25" y="207" fill="#cbd5e1" font-size="10.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Next.js</text>
            
            <rect x="132.5" y="192" width="68.5" height="22" rx="4" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
            <text x="166.75" y="207" fill="#cbd5e1" font-size="10.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Llama-3</text>
            
            <rect x="209.0" y="192" width="68.5" height="22" rx="4" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
            <text x="243.25" y="207" fill="#cbd5e1" font-size="10.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Whisper</text>
            
            <rect x="285.5" y="192" width="76.0" height="22" rx="4" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
            <text x="323.5" y="207" fill="#cbd5e1" font-size="10.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Supabase</text>
            
            <rect x="369.5" y="192" width="68.5" height="22" rx="4" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
            <text x="403.75" y="207" fill="#cbd5e1" font-size="10.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">FastAPI</text>
            
        </g>
        
        <!-- Card 2: Guardian Transit AI -->
        <g class="project-card">
            <rect x="460" y="60" width="404" height="176" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.2"/>
            
            <!-- Status Badge -->
            <g transform="translate(480, 78)">
                <rect width="124" height="22" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
                <circle cx="12" cy="11" r="3.5" fill="#60a5fa" />
                <text x="68" y="15" fill="#60a5fa" font-size="9.5" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">LIVE PRODUCTION</text>
            </g>

            <!-- Action Prompt -->
            <text x="844" y="93" fill="#60a5fa" font-size="11" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">LAUNCH APP ↗</text>
            
            <!-- Title & Subtitle -->
            <text x="480" y="124" fill="#f8fafc" font-size="19" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Guardian Transit AI</text>
            <text x="480" y="144" fill="#818cf8" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Edge AI & Biometric Public Transit Safety</text>
            
            <!-- Description -->
            <text x="480" y="164" fill="#94a3b8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
                <tspan x="480" dy="0">Real-time CV pipeline using YOLOv8 & ArcFace 512-d embeddings,</tspan>
                <tspan x="480" dy="16">sub-50ms pgvector similarity search & live transit telemetry.</tspan>
            </text>
            
            <!-- Tech Stack Pills -->
            
            <rect x="480" y="192" width="68.5" height="22" rx="4" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
            <text x="514.25" y="207" fill="#cbd5e1" font-size="10.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">FastAPI</text>
            
            <rect x="556.5" y="192" width="61.0" height="22" rx="4" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
            <text x="587.0" y="207" fill="#cbd5e1" font-size="10.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">YOLOv8</text>
            
            <rect x="625.5" y="192" width="68.5" height="22" rx="4" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
            <text x="659.75" y="207" fill="#cbd5e1" font-size="10.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ArcFace</text>
            
            <rect x="702.0" y="192" width="76.0" height="22" rx="4" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
            <text x="740.0" y="207" fill="#cbd5e1" font-size="10.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">pgvector</text>
            
            <rect x="786.0" y="192" width="61.0" height="22" rx="4" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
            <text x="816.5" y="207" fill="#cbd5e1" font-size="10.5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Python</text>
            
        </g>
        
</svg>