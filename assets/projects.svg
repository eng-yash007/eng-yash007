    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, monospace; }
    </style>

    <!-- Background Frame -->
    <rect width="900" height="250" rx="14" fill="url(#proj-bg)" />
    <rect width="900" height="250" rx="14" fill="none" stroke="url(#proj-border)" stroke-width="1.2" />

    <!-- Top Header -->
    <g transform="translate(36, 32)">
