            </g>

            <text x="846" y="86" fill="#60a5fa" font-size="10" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">OPEN APP ↗</text>
            
            <!-- Title -->
            <text x="476" y="110" fill="#f8fafc" font-size="17" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Guardian Transit AI</text>
            <text x="476" y="128" fill="#818cf8" font-size="11.5" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Edge AI & Biometric Public Transit Security</text>
            
            <!-- Description -->
            <text x="476" y="148" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
                <tspan x="476" dy="0">Real-time CV pipeline using YOLOv8 & ArcFace for 512-d biometric embeddings.</tspan>
                <tspan x="476" dy="16">Sub-50ms pgvector similarity search, multi-camera tracking & live alerts.</tspan>
            </text>
            
