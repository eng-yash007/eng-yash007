            <!-- Action 2: GitHub Repository (Inside Card) -->
            <a href="https://github.com/eng-yash007/guardian-transit" xlink:href="https://github.com/eng-yash007/guardian-transit" target="_blank" class="action-btn">
                <rect x="668" y="216" width="176" height="28" rx="6" fill="#0D1424" stroke="#8B5CF6" stroke-opacity="0.8" stroke-width="1"/>
                <text x="756.0" y="234" fill="#8B5CF6" font-size="11" font-weight="600" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">GitHub Repo ↗</text>
