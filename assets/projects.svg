<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220">
    <style>
        .text-primary { font-family: JetBrains Mono, monospace; fill: #c9d1d9; }
        .text-secondary { font-family: JetBrains Mono, monospace; fill: #8b949e; }
        .text-accent { font-family: JetBrains Mono, monospace; fill: #39d353; }
        .bg { fill: #0d1117; }
        .border { stroke: #30363d; fill: none; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .fade-in {
            animation: fadeIn 0.4s forwards ease-in-out;
        }
    </style>
    
    <rect width="400" height="220" class="bg" rx="6" />
    <rect width="400" height="220" class="border" rx="6" stroke-width="2"/>
    
    
    <rect width="100%" height="30" fill="#30363d" rx="4" />
    <circle cx="15" cy="15" r="6" fill="#ff5f56"/>
    <circle cx="35" cy="15" r="6" fill="#ffbd2e"/>
    <circle cx="55" cy="15" r="6" fill="#27c93f"/>
    <text x="50%" y="20" class="text-primary" font-size="14" text-anchor="middle">yash@github: ~/projects</text>
    
    
    <g class="fade-in" style="animation-delay: 0.5s; opacity: 0;">
        <text x="30" y="70" font-size="14" class="text-accent">projects/</text>
    </g>
    
        <g class="fade-in" style="animation-delay: 0.8s; opacity: 0;">
            <text x="30" y="100" font-size="14" class="text-secondary">├── </text>
            <text x="65" y="100" font-size="14" class="text-primary">Silent Gallery</text>
        </g>
        
        <g class="fade-in" style="animation-delay: 1.1s; opacity: 0;">
            <text x="30" y="125" font-size="14" class="text-secondary">├── </text>
            <text x="65" y="125" font-size="14" class="text-primary">DocuDost</text>
        </g>
        
        <g class="fade-in" style="animation-delay: 1.4000000000000001s; opacity: 0;">
            <text x="30" y="150" font-size="14" class="text-secondary">├── </text>
            <text x="65" y="150" font-size="14" class="text-primary">Traffic Management</text>
        </g>
        
        <g class="fade-in" style="animation-delay: 1.7000000000000002s; opacity: 0;">
            <text x="30" y="175" font-size="14" class="text-secondary">└── </text>
            <text x="65" y="175" font-size="14" class="text-primary">Murliwala Sarees</text>
        </g>
        
</svg>