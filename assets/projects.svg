            <!-- Action 1: Live Demo (Inside Card) -->
            <a href="https://silent-galleryyy.vercel.app" xlink:href="https://silent-galleryyy.vercel.app" target="_blank" class="action-btn">
                <rect x="56" y="216" width="176" height="28" rx="6" fill="#0D1424" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="1"/>
                <text x="144.0" y="234" fill="#38BDF8" font-size="11" font-weight="600" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Live Demo ↗</text>
            </a>

            <!-- Action 2: GitHub Repository (Inside Card) -->
