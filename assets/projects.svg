            <rect x="130.5" y="184" width="66.5" height="20" rx="4" fill="#1e293b" fill-opacity="0.85"/>
            <text x="163.75" y="198" fill="#cbd5e1" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Llama-3</text>
            
            <rect x="205.0" y="184" width="66.5" height="20" rx="4" fill="#1e293b" fill-opacity="0.85"/>
            <text x="238.25" y="198" fill="#cbd5e1" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Whisper</text>
            
            <rect x="279.5" y="184" width="74.0" height="20" rx="4" fill="#1e293b" fill-opacity="0.85"/>
            <text x="316.5" y="198" fill="#cbd5e1" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Supabase</text>
            
            <rect x="361.5" y="184" width="66.5" height="20" rx="4" fill="#1e293b" fill-opacity="0.85"/>
            <text x="394.75" y="198" fill="#cbd5e1" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">FastAPI</text>
            
        </g>
        
        <!-- Project 2: Guardian Transit AI -->
        <g class="project-card">
            <rect x="458" y="56" width="406" height="168" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.2"/>
            
            <!-- Status Badge -->
