            <rect x="478" y="184" width="66.5" height="20" rx="4" fill="#1e293b" fill-opacity="0.85"/>
            <text x="511.25" y="198" fill="#cbd5e1" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">FastAPI</text>
            
            <rect x="552.5" y="184" width="59.0" height="20" rx="4" fill="#1e293b" fill-opacity="0.85"/>
            <text x="582.0" y="198" fill="#cbd5e1" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">YOLOv8</text>
            
            <rect x="619.5" y="184" width="66.5" height="20" rx="4" fill="#1e293b" fill-opacity="0.85"/>
