            <text x="512.2" y="184" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">FastAPI</text>
            
            <rect x="550.4" y="170" width="57.2" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="579.0" y="184" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">YOLOv8</text>
            
            <rect x="613.6" y="170" width="64.4" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="645.8" y="184" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ArcFace</text>
            
            <rect x="684.0" y="170" width="71.6" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="719.8" y="184" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">pgvector</text>
            
            <rect x="761.6" y="170" width="57.2" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="790.2" y="184" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Python</text>
            

            <!-- Divider -->
            <line x1="480" y1="204" x2="844" y2="204" stroke="#1E293B" stroke-width="1" />

            <!-- Action 1: Live Demo (Inside Card) -->
            <a href="https://guardian-transit-zeta.vercel.app" xlink:href="https://guardian-transit-zeta.vercel.app" target="_blank" class="action-btn">
                <rect x="480" y="216" width="176" height="28" rx="6" fill="#0D1424" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="1"/>
                <text x="568.0" y="234" fill="#38BDF8" font-size="11" font-weight="600" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Live Demo ↗</text>
