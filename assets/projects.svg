<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
    <defs>
        <linearGradient id="proj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#080D18" />
            <stop offset="50%" stop-color="#0D1424" />
            <stop offset="100%" stop-color="#080D18" />
        </linearGradient>

        <linearGradient id="card-inner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B1120" />
            <stop offset="100%" stop-color="#080D18" />
        </linearGradient>

        <linearGradient id="proj-border" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
            <stop offset="50%" stop-color="#334155" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#1E293B" stop-opacity="0.9"/>
        </linearGradient>
    </defs>

    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>

    <!-- Outer Container -->
    <rect width="900" height="220" rx="14" fill="url(#proj-bg)" stroke="url(#proj-border)" stroke-width="1.2"/>
    
    <!-- Header -->
    <g transform="translate(36, 31)">
        <text x="0" y="0" fill="#38BDF8" font-size="11.5" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.16em">FEATURED.SYSTEMS // PRODUCTION DEPLOYMENTS</text>
        <text x="828" y="0" fill="#64748B" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end"><tspan fill="#34D399">● </tspan>2 FLAGSHIPS ACTIVE</text>
    </g>

    
        <!-- Card 1: Silent Gallery -->
        <g class="project-card">
            <!-- Card Outer Surface -->
            <rect x="36" y="52" width="404" height="144" rx="10" fill="url(#card-inner-bg)" stroke="#1E293B" stroke-width="1.1"/>
            
            <!-- Title & Status Badge -->
            <g transform="translate(56, 76)">
                <text x="0" y="0" fill="#F8FAFC" font-size="16" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Silent Gallery</text>
                
                <!-- Minimal Status Badge -->
                <g transform="translate(364, 0)">
                    <rect x="-80" y="-12" width="80" height="18" rx="4" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="0.8"/>
                    <circle cx="-70" cy="-3" r="2.5" fill="#34D399" />
                    <text x="-36" y="0.5" fill="#34D399" font-size="9.5" font-weight="600" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Live Demo</text>
                </g>
            </g>
            
            <!-- Category / Subtitle -->
            <text x="56" y="96" fill="#A78BFA" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Voice AI &amp; Smart Task Workspace</text>
            
            <!-- Description -->
            <text x="56" y="117" fill="#94A3B8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
                <tspan x="56" dy="0">Voice productivity hub powered by Whisper &amp; Llama-3 for</tspan>
                <tspan x="56" dy="16">hands-free task execution and automated calendar scheduling.</tspan>
            </text>
            
            <!-- Tech Stack Pills -->
            
            <rect x="56.0" y="156" width="61.5" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="86.8" y="170" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Next.js</text>
            
            <rect x="125.5" y="156" width="61.5" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="156.2" y="170" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Llama-3</text>
            
            <rect x="195.0" y="156" width="61.5" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="225.8" y="170" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Whisper</text>
            
            <rect x="264.5" y="156" width="68.0" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="298.5" y="170" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Supabase</text>
            
            <rect x="340.5" y="156" width="61.5" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="371.2" y="170" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">FastAPI</text>
            
        </g>
        
        <!-- Card 2: Guardian Transit AI -->
        <g class="project-card">
            <!-- Card Outer Surface -->
            <rect x="460" y="52" width="404" height="144" rx="10" fill="url(#card-inner-bg)" stroke="#1E293B" stroke-width="1.1"/>
            
            <!-- Title & Status Badge -->
            <g transform="translate(480, 76)">
                <text x="0" y="0" fill="#F8FAFC" font-size="16" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Guardian Transit AI</text>
                
                <!-- Minimal Status Badge -->
                <g transform="translate(364, 0)">
                    <rect x="-80" y="-12" width="80" height="18" rx="4" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="0.8"/>
                    <circle cx="-70" cy="-3" r="2.5" fill="#34D399" />
                    <text x="-36" y="0.5" fill="#34D399" font-size="9.5" font-weight="600" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Live Demo</text>
                </g>
            </g>
            
            <!-- Category / Subtitle -->
            <text x="480" y="96" fill="#38BDF8" font-size="11.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">Computer Vision &amp; Student Safety</text>
            
            <!-- Description -->
            <text x="480" y="117" fill="#94A3B8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif">
                <tspan x="480" dy="0">Real-time edge CV pipeline with YOLOv8 &amp; ArcFace embeddings,</tspan>
                <tspan x="480" dy="16">sub-50ms pgvector similarity search &amp; live transit telemetry.</tspan>
            </text>
            
            <!-- Tech Stack Pills -->
            
            <rect x="480.0" y="156" width="61.5" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="510.8" y="170" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">FastAPI</text>
            
            <rect x="549.5" y="156" width="55.0" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="577.0" y="170" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">YOLOv8</text>
            
            <rect x="612.5" y="156" width="61.5" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="643.2" y="170" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ArcFace</text>
            
            <rect x="682.0" y="156" width="68.0" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="716.0" y="170" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">pgvector</text>
            
            <rect x="758.0" y="156" width="55.0" height="20" rx="4" fill="#0D1424" stroke="#1E293B" stroke-width="1"/>
            <text x="785.5" y="170" fill="#94A3B8" font-size="10" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Python</text>
            
        </g>
        
</svg>