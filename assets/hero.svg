<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250">
    <defs>
        <!-- Background Gradients -->
        <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#07090e" />
            <stop offset="50%" stop-color="#0b101b" />
            <stop offset="100%" stop-color="#080c14" />
        </linearGradient>

        <!-- Ambient Glow -->
        <radialGradient id="ambient-glow" cx="80%" cy="10%" r="60%">
            <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18" />
            <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#000000" stop-opacity="0" />
        </radialGradient>

        <!-- Yash Gradient -->
        <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#818cf8" />
            <stop offset="50%" stop-color="#a78bfa" />
            <stop offset="100%" stop-color="#2dd4bf" />
        </linearGradient>

        <!-- Card Glow Border -->
        <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#334155" stop-opacity="0.7"/>
            <stop offset="50%" stop-color="#1e293b" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
        </linearGradient>

        <!-- 1-Shot Typing Clip Path for 'Hi, I'm Yash.' -->
        <clipPath id="typing-clip">
            <rect x="36" y="60" width="0" height="65">
                <animate attributeName="width" from="0" to="340" dur="1.3s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
            </rect>
        </clipPath>
    </defs>

    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }

        /* Status Beacon Pulse */
        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.6); opacity: 0; }
        }
        .beacon {
            animation: pulseDot 2s infinite ease-in-out;
            transform-origin: 52px 42px;
        }

        /* Cursor Blink */
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .cursor {
            animation: blink 0.9s infinite;
        }
    </style>

    <!-- Card Base -->
    <rect width="900" height="250" rx="16" fill="url(#hero-bg)" />
    <rect width="900" height="250" rx="16" fill="url(#ambient-glow)" />
    <rect width="900" height="250" rx="16" fill="none" stroke="url(#border-grad)" stroke-width="1.2" />

    <!-- Status Pill: Open to opportunities -->
    <g transform="translate(36, 28)">
        <rect width="250" height="28" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
        <!-- Green indicator -->
        <circle cx="16" cy="14" r="5" fill="#10b981" />
        <circle cx="16" cy="14" r="7" fill="#10b981" opacity="0.3" class="beacon"/>
        <text x="32" y="18.5" fill="#94a3b8" font-size="12" font-weight="500" class="font-sans">
            Open to opportunities  ·  Batch 2027
        </text>
    </g>

    <!-- Big Heading with 1-shot Typing Animation: Hi, I'm Yash. -->
    <g clip-path="url(#typing-clip)">
        <text x="36" y="112" class="font-sans" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-0.03em">
            Hi, I'm <tspan fill="url(#name-grad)">Yash.</tspan>
        </text>
    </g>
    <!-- Traveling Typing Cursor -->
    <line x1="36" y1="78" x2="36" y2="114" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" class="cursor">
        <animate attributeName="x1" from="36" to="330" dur="1.3s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
        <animate attributeName="x2" from="36" to="330" dur="1.3s" begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
    </line>

    <!-- Subheading: Generative AI Engineer -->
    <g transform="translate(36, 150)">
        <text x="0" y="0" class="font-sans" font-size="19" font-weight="600" fill="#f1f5f9">
            Generative AI Engineer · Eager to build intelligent systems
        </text>
    </g>

    <!-- Description Paragraph -->
    <text x="36" y="196" class="font-sans" font-size="14.5" fill="#94a3b8" letter-spacing="-0.01em">
        Computer Science (Data Science) undergraduate engineer turning LLMs, RAG
    </text>
    <text x="36" y="220" class="font-sans" font-size="14.5" fill="#94a3b8" letter-spacing="-0.01em">
        and intelligent agent architectures into high-performance production systems.
    </text>
</svg>