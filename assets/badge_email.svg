<svg xmlns="http://www.w3.org/2000/svg" width="132" height="34" viewBox="0 0 132 34">
    <defs>
        <linearGradient id="bg-grad-email" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0d1322" />
            <stop offset="100%" stop-color="#060912" />
        </linearGradient>

        <linearGradient id="border-grad-email" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#f472b6" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6" />
        </linearGradient>
    </defs>

    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }

        @keyframes badgePulse {
            0%, 100% { stroke-opacity: 0.5; }
            50% { stroke-opacity: 0.95; }
        }
        @keyframes dotGlow {
            0%, 100% { r: 2.2px; opacity: 0.6; }
            50% { r: 3.2px; opacity: 1; }
        }

        .card-border {
            animation: badgePulse 3s infinite ease-in-out;
        }
        .live-dot {
            animation: dotGlow 2s infinite ease-in-out;
        }
    </style>

    <!-- Pill Container -->
    <rect width="132" height="34" rx="17" fill="url(#bg-grad-email)" />
    <rect width="132" height="34" rx="17" fill="none" stroke="url(#border-grad-email)" stroke-width="1.1" class="card-border" />

    <!-- Icon on Left -->
    <g transform="translate(10, 8.5) scale(0.85)">
        <path fill="#ec4899" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
    </g>

    <!-- Text details -->
    <text x="32" y="15" class="font-sans" font-size="10.5" font-weight="700" fill="#f8fafc">
        Email
    </text>
    <text x="32" y="26" class="font-mono" font-size="8" font-weight="500" fill="#94a3b8">
        Direct Connect
    </text>

    <!-- Live indicator on Right -->
    <circle cx="120" cy="17" r="2.5" fill="#ec4899" class="live-dot" />
</svg>