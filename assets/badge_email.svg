<svg xmlns="http://www.w3.org/2000/svg" width="175" height="42" viewBox="0 0 175 42">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0b101c" />
            <stop offset="100%" stop-color="#050811" />
        </linearGradient>

        <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#fb7185" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.7" />
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }

        @keyframes badgePulse {
            0%, 100% {
                stroke-opacity: 0.6;
            }
            50% {
                stroke-opacity: 1;
                filter: drop-shadow(0 0 4px #fb7185);
            }
        }

        @keyframes dotGlow {
            0%, 100% { r: 3px; opacity: 0.8; }
            50% { r: 4.5px; opacity: 1; }
        }

        .card-border {
            animation: badgePulse 3s infinite ease-in-out;
        }
        .live-dot {
            animation: dotGlow 2s infinite ease-in-out;
        }
    </style>

    <!-- Pill Container -->
    <rect width="175" height="42" rx="21" fill="url(#bg-grad)" />
    <rect width="175" height="42" rx="21" fill="none" stroke="url(#border-grad)" stroke-width="1.3" class="card-border" />

    <!-- Icon on Left -->
    <g transform="translate(14, 11)">
        <path fill="#f43f5e" d="M1.5 4.5A2.5 2.5 0 014 2h12a2.5 2.5 0 012.5 2.5v11a2.5 2.5 0 01-2.5 2.5H4a2.5 2.5 0 01-2.5-2.5v-11zm2.75.5L10 9.75 15.75 5H4.25zM17 6.35l-6.53 5.37a.75.75 0 01-.94 0L3 6.35V15.5c0 .414.336.75.75.75h12.5a.75.75 0 00.75-.75V6.35z"/>
    </g>

    <!-- Text details -->
    <text x="44" y="19" class="font-sans" font-size="11.5" font-weight="700" fill="#f8fafc">
        Email
    </text>
    <text x="44" y="32" class="font-mono" font-size="10" font-weight="500" fill="#94a3b8">
        Direct Connect
    </text>

    <!-- Right Live Dot -->
    <circle cx="159" cy="21" r="3.5" fill="#f43f5e" class="live-dot" />
</svg>