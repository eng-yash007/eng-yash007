<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210">
    <defs>
        <linearGradient id="metrics-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#080D18" />
            <stop offset="50%" stop-color="#0D1424" />
            <stop offset="100%" stop-color="#080D18" />
        </linearGradient>

        <linearGradient id="card-inner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B1120" />
            <stop offset="100%" stop-color="#080D18" />
        </linearGradient>

        <linearGradient id="metrics-border" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
            <stop offset="50%" stop-color="#334155" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#1E293B" stop-opacity="0.9"/>
        </linearGradient>
    </defs>

    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }
        .text-white { fill: #F1F5F9; }
        .text-muted { fill: #64748B; }
        .text-accent { fill: #22D3EE; }
    </style>

    <!-- Background Frame -->
    <rect width="900" height="210" rx="14" fill="url(#metrics-bg)" />
    <rect width="900" height="210" rx="14" fill="none" stroke="url(#metrics-border)" stroke-width="1.2" />

    <!-- Top Header -->
    <g transform="translate(36, 32)">
        <text x="0" y="0" class="font-mono text-accent" font-size="11.5" font-weight="700" letter-spacing="0.16em">
            SYSTEM.METRICS // VERIFIED TELEMETRY
        </text>
        <text x="828" y="0" class="font-mono text-muted" font-size="10" text-anchor="end">
            Updated: 2026-11-26 07:38 UTC
        </text>
    </g>

    <!-- COLUMN 1: GITHUB -->
    <g transform="translate(36, 56)">
        <rect width="265" height="118" rx="10" fill="url(#card-inner-bg)" stroke="#1E293B" stroke-width="1.1"/>
        
        <!-- Header Tag -->
        <g transform="translate(16, 16)">
            <text x="0" y="0" class="font-mono" font-size="11" font-weight="700" fill="#38BDF8">[ GITHUB ]</text>
            <text x="233" y="0" class="font-mono text-muted" font-size="9.5" text-anchor="end">REST API</text>
        </g>
        
        <!-- Metrics Row -->
        <g transform="translate(16, 42)">
            <!-- Repos -->
            <text x="0" y="0" class="font-mono text-muted" font-size="10">REPOSITORIES</text>
            <text x="0" y="24" class="font-sans text-white" font-size="22" font-weight="800">13</text>
            
            <!-- Stars -->
            <text x="96" y="0" class="font-mono text-muted" font-size="10">STARS</text>
            <g transform="translate(96, 24)">
                <text x="0" y="0" class="font-sans" font-size="22" font-weight="800" fill="#FBBF24">16★</text>
            </g>

            <!-- Followers -->
            <text x="170" y="0" class="font-mono text-muted" font-size="10">FOLLOWERS</text>
            <text x="170" y="24" class="font-sans text-white" font-size="22" font-weight="800">1</text>
        </g>
        
        <text x="16" y="106" class="font-mono text-muted" font-size="9.5">github.com/eng-yash007</text>
    </g>

    <!-- COLUMN 2: LEETCODE -->
    <g transform="translate(317, 56)">
        <rect width="265" height="118" rx="10" fill="url(#card-inner-bg)" stroke="#1E293B" stroke-width="1.1"/>
        
        <!-- Header Tag -->
        <g transform="translate(16, 16)">
            <text x="0" y="0" class="font-mono" font-size="11" font-weight="700" fill="#F59E0B">[ LEETCODE ]</text>
            <text x="233" y="0" class="font-mono text-muted" font-size="9.5" text-anchor="end">GraphQL</text>
        </g>
        
        <!-- Metrics Row -->
        <g transform="translate(16, 42)">
            <!-- Total Solved -->
            <text x="0" y="0" class="font-mono text-muted" font-size="10">PROBLEMS</text>
            <text x="0" y="24" class="font-sans text-white" font-size="22" font-weight="800">206</text>
            
            <!-- Difficulty breakdown -->
            <g transform="translate(86, -6)">
                <text x="0" y="10" class="font-mono" font-size="9.5" fill="#34D399">Easy: 109</text>
                <text x="0" y="23" class="font-mono" font-size="9.5" fill="#FBBF24">Med:  87</text>
                <text x="0" y="36" class="font-mono" font-size="9.5" fill="#F43F5E">Hard: 10</text>
            </g>

            <!-- Ranking -->
            <g transform="translate(156, 0)">
                <text x="0" y="0" class="font-mono text-muted" font-size="10">GLOBAL RANK</text>
                <text x="0" y="20" class="font-mono text-white" font-size="11.5" font-weight="700">#854,976</text>
            </g>
        </g>
        
        <text x="16" y="106" class="font-mono text-muted" font-size="9.5">leetcode.com/eng-yash007</text>
    </g>

    <!-- COLUMN 3: CODECHEF -->
    <g transform="translate(598, 56)">
        <rect width="265" height="118" rx="10" fill="url(#card-inner-bg)" stroke="#1E293B" stroke-width="1.1"/>
        
        <!-- Header Tag -->
        <g transform="translate(16, 16)">
            <text x="0" y="0" class="font-mono" font-size="11" font-weight="700" fill="#EA580C">[ CODECHEF ]</text>
            <text x="233" y="0" class="font-mono text-muted" font-size="9.5" text-anchor="end">Verified</text>
        </g>
        
        <!-- Metrics Row -->
        <g transform="translate(16, 42)">
            <!-- Problems Solved -->
            <text x="0" y="0" class="font-mono text-muted" font-size="10">PROBLEMS</text>
            <text x="0" y="24" class="font-sans text-white" font-size="22" font-weight="800">600</text>
            
            <!-- Global Rank -->
            <g transform="translate(86, 0)">
                <text x="0" y="0" class="font-mono text-muted" font-size="10">GLOBAL RANK</text>
                <text x="0" y="22" class="font-mono text-white" font-size="13" font-weight="700">#65,226</text>
            </g>

            <!-- Division -->
            <g transform="translate(186, 0)">
                <text x="0" y="0" class="font-mono text-muted" font-size="10">DIVISION</text>
                <text x="0" y="22" class="font-sans" font-size="16" font-weight="800" fill="#EA580C">1★</text>
            </g>
        </g>
        
        <text x="16" y="106" class="font-mono text-muted" font-size="9.5">codechef.com/yashgupta9171</text>
    </g>
</svg>