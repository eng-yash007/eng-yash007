<svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180">
    <style>
        .text-primary { font-family: JetBrains Mono, monospace; fill: #c9d1d9; }
        .text-secondary { font-family: JetBrains Mono, monospace; fill: #8b949e; }
        .text-accent { font-family: JetBrains Mono, monospace; fill: #39d353; }
        .bg { fill: #0d1117; }
        .border { stroke: #30363d; fill: none; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .fade-in {
            animation: fadeIn 0.5s forwards;
        }
    </style>
    
    <rect width="600" height="180" class="bg" rx="6" />
    <rect width="600" height="180" class="border" rx="6" stroke-width="2"/>
    
    
    <rect width="100%" height="30" fill="#30363d" rx="4" />
    <circle cx="15" cy="15" r="6" fill="#ff5f56"/>
    <circle cx="35" cy="15" r="6" fill="#ffbd2e"/>
    <circle cx="55" cy="15" r="6" fill="#27c93f"/>
    <text x="50%" y="20" class="text-primary" font-size="14" text-anchor="middle">yash@github: ~/quote</text>
    
    
    <g class="fade-in" style="animation-delay: 0.5s; opacity: 0;">
        <text x="30" y="60" font-size="14" class="text-accent">$ fortune</text>
    </g>
    
        <g class="fade-in" style="animation-delay: 1.0s; opacity: 0;">
            <text x="30" y="90" font-size="14" class="text-primary" font-style="italic">"Treat every moment as your last. It is not preparation for"</text>
        </g>
        
        <g class="fade-in" style="animation-delay: 1.2s; opacity: 0;">
            <text x="30" y="115" font-size="14" class="text-primary" font-style="italic">"something else."</text>
        </g>
        
    <g class="fade-in" style="animation-delay: 1.4s; opacity: 0;">
        <text x="30" y="150" font-size="14" class="text-secondary">— Shunryu Suzuki</text>
    </g>
    
</svg>