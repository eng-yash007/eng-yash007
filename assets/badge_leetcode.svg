<svg xmlns="http://www.w3.org/2000/svg" width="132" height="34" viewBox="0 0 132 34">
    <defs>
        <linearGradient id="bg-grad-leetcode" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0d1322" />
            <stop offset="100%" stop-color="#060912" />
        </linearGradient>

        <linearGradient id="border-grad-leetcode" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffa116" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#ffa116" stop-opacity="0.6" />
        </linearGradient>
    </defs>

    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }

        @keyframes badgePulse {
            0%, 100% { stroke-opacity: 0.5; }
            50% { stroke-opacity: 0.95; }
        }
        @keyframes dotGlow {
            0%, 100% { r: 2.2px; opacity: 0.6; }
            50% { r: 3.2px; opacity: 1; }
        }

        .card-border {
            animation: badgePulse 3s infinite ease-in-out;
        }
        .live-dot {
            animation: dotGlow 2s infinite ease-in-out;
        }
    </style>

    <!-- Pill Container -->
    <rect width="132" height="34" rx="17" fill="url(#bg-grad-leetcode)" />
    <rect width="132" height="34" rx="17" fill="none" stroke="url(#border-grad-leetcode)" stroke-width="1.1" class="card-border" />

    <!-- Icon on Left -->
    <g transform="translate(10, 8.5) scale(0.85)">
        <path fill="#ffa116" d="M13.483 0a1.374 1.374 0 0 0-.961.438L7.116 6.226l-3.854 4.126a5.266 5.266 0 0 0-1.209 2.104 5.35 5.35 0 0 0-.125.513 5.527 5.527 0 0 0 .062 2.362 5.83 5.83 0 0 0 .349 1.017 5.938 5.938 0 0 0 1.271 1.818l4.277 4.193.039.038c2.248 2.165 5.852 2.133 8.063-.074l2.396-2.392c.54-.54.54-1.414.003-1.955a1.378 1.378 0 0 0-1.951-.003l-2.396 2.392a3.021 3.021 0 0 1-4.205.038l-.02-.019-4.276-4.193c-.652-.64-.972-1.469-.948-2.263a2.68 2.68 0 0 1 .066-.523 2.545 2.545 0 0 1 .619-1.164L9.13 8.114c1.058-1.134 3.204-1.27 4.43-.278l3.501 2.831c.593.48 1.461.387 1.94-.207a1.384 1.384 0 0 0-.207-1.943l-3.5-2.831c-2.42-1.955-5.918-1.632-7.811.458z"/>
    </g>

    <!-- Text details -->
    <text x="32" y="15" class="font-sans" font-size="10.5" font-weight="700" fill="#f8fafc">
        LeetCode
    </text>
    <text x="32" y="26" class="font-mono" font-size="8" font-weight="500" fill="#94a3b8">
        eng-yash007
    </text>

    <!-- Live indicator on Right -->
    <circle cx="120" cy="17" r="2.5" fill="#ffa116" class="live-dot" />
</svg>