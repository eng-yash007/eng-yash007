<svg xmlns="http://www.w3.org/2000/svg" width="175" height="42" viewBox="0 0 175 42">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0b101c" />
            <stop offset="100%" stop-color="#050811" />
        </linearGradient>

        <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.7" />
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }

        @keyframes badgePulse {
            0%, 100% {
                stroke-opacity: 0.6;
            }
            50% {
                stroke-opacity: 1;
                filter: drop-shadow(0 0 4px #fbbf24);
            }
        }

        @keyframes dotGlow {
            0%, 100% { r: 3px; opacity: 0.8; }
            50% { r: 4.5px; opacity: 1; }
        }

        .card-border {
            animation: badgePulse 3s infinite ease-in-out;
        }
        .live-dot {
            animation: dotGlow 2s infinite ease-in-out;
        }
    </style>

    <!-- Pill Container -->
    <rect width="175" height="42" rx="21" fill="url(#bg-grad)" />
    <rect width="175" height="42" rx="21" fill="none" stroke="url(#border-grad)" stroke-width="1.3" class="card-border" />

    <!-- Icon on Left -->
    <g transform="translate(14, 11)">
        <path fill="#fbbf24" d="M13.483 0a1.374 1.374 0 00-.961.438L7.116 6.226l-3.854 4.126a5.266 5.266 0 00-1.209 2.104 5.35 5.35 0 00-.125.513 5.527 5.527 0 00.271 4.735 5.32 5.32 0 004.126 2.671 5.362 5.362 0 004.604-1.583l4.558-4.882a1.376 1.376 0 00-.02-1.921 1.376 1.376 0 00-1.921.02L9.127 16.9a2.604 2.604 0 01-2.24 1.042 2.604 2.604 0 01-2.01-1.302 2.698 2.698 0 01-.135-2.312c.135-.375.354-.708.646-.979l4.558-4.882 4.412-4.72a1.376 1.376 0 00-.875-2.747z"/><path fill="#f59e0b" d="M9.833 10.979h8.334a1.375 1.375 0 000-2.75H9.833a1.375 1.375 0 000 2.75z"/>
    </g>

    <!-- Text details -->
    <text x="44" y="19" class="font-sans" font-size="11.5" font-weight="700" fill="#f8fafc">
        LeetCode
    </text>
    <text x="44" y="32" class="font-mono" font-size="10" font-weight="500" fill="#94a3b8">
        eng-yash007
    </text>

    <!-- Right Live Dot -->
    <circle cx="159" cy="21" r="3.5" fill="#f59e0b" class="live-dot" />
</svg>