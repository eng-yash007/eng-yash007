<svg xmlns="http://www.w3.org/2000/svg" width="132" height="34" viewBox="0 0 132 34">
    <defs>
        <linearGradient id="bg-grad-codechef" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0d1322" />
            <stop offset="100%" stop-color="#060912" />
        </linearGradient>

        <linearGradient id="border-grad-codechef" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ea580c" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#f97316" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#ea580c" stop-opacity="0.6" />
        </linearGradient>
    </defs>

    <style>
        .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }

        @keyframes badgePulse {
            0%, 100% { stroke-opacity: 0.5; }
            50% { stroke-opacity: 0.95; }
        }
        @keyframes dotGlow {
            0%, 100% { r: 2.2px; opacity: 0.6; }
            50% { r: 3.2px; opacity: 1; }
        }

        .card-border {
            animation: badgePulse 3s infinite ease-in-out;
        }
        .live-dot {
            animation: dotGlow 2s infinite ease-in-out;
        }
    </style>

    <!-- Pill Container -->
    <rect width="132" height="34" rx="17" fill="url(#bg-grad-codechef)" />
    <rect width="132" height="34" rx="17" fill="none" stroke="url(#border-grad-codechef)" stroke-width="1.1" class="card-border" />

    <!-- Icon on Left -->
    <g transform="translate(10, 8.5) scale(0.85)">
        <path fill="#ea580c" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
    </g>

    <!-- Text details -->
    <text x="32" y="15" class="font-sans" font-size="10.5" font-weight="700" fill="#f8fafc">
        CodeChef
    </text>
    <text x="32" y="26" class="font-mono" font-size="8" font-weight="500" fill="#94a3b8">
        yashgupta9171
    </text>

    <!-- Live indicator on Right -->
    <circle cx="120" cy="17" r="2.5" fill="#ea580c" class="live-dot" />
</svg>