    :root {
      --bg: #080D18;

      --accent-cyan: #38bdf8;
      --border: #1e293b;
      --text-white: #f8fafc;

    body {
      background-color: var(--bg);

      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      width: 100%;
      text-align: center;
    }
    img {
      max-width: 100%;
      height: auto;
      display: inline-block;
    }
    table {
      border-collapse: collapse;
      margin: 0 auto;
      border: none;
    }
    td {
      padding: 8px;
      border: none;
    }
    a {
      color: var(--accent-cyan);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    a:hover {
      opacity: 0.85;
    }
    .spacer {
      height: 32px;
    }
