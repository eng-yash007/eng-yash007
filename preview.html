    :root {
      --bg: #080D18;
      --surface: #0D1424;
      --accent-blue: #38BDF8;
      --accent-violet: #8B5CF6;
      --accent-cyan: #22D3EE;
      --border: #1E293B;
      --text-white: #F1F5F9;
      --text-muted: #94A3B8;
    }
    body {
      background-color: var(--bg);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      width: 100%;
      text-align: center;
    }
    img {
      max-width: 100%;
      height: auto;
      display: inline-block;
    }
    table {
      border-collapse: collapse;
      margin: 0 auto;
      border: none;
    }
    td {
      padding: 8px;
      border: none;
    }
    a {
      color: var(--accent-blue);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    a:hover {
      opacity: 0.85;
      text-decoration: underline;
    }
    .spacer {
      height: 32px;
    }
  </style>
